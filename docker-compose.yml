version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_pass
    ports:
      - "15432:5432"
    volumes:
      - parking_pgdata:/var/lib/postgresql/data

volumes:
  parking_pgdata:
